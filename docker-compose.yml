services:
  alliance-manager:
    # Pinned to the release named by APP_VERSION in .env, which install.sh and
    # manage.sh write for you. Compose interpolates it here from .env; the
    # `env_file:` below is a different mechanism (it passes variables INTO the
    # container) and does not reach an `image:` line, so the two are not
    # duplicates -- don't "deduplicate" them.
    #
    # The fallback is a sane default rather than a transition hack: `latest`
    # means the latest RELEASE (main publishes `edge`). To pin or roll back,
    # `./scripts/manage.sh update --version vX.Y.Z` moves this file and the
    # image together. See docs/RELEASING.md.
    image: ghcr.io/shodiwarmic/lastwar-alliance-manager:${APP_VERSION:-latest}
    container_name: alliance-manager
    restart: unless-stopped
    # Allow graceful shutdown (25s server drain + up to 10s archive drain) to
    # finish before Docker sends SIGKILL. Default is 10s, which would cut it short.
    stop_grace_period: 45s
    env_file: .env
    environment:
      # Ensure uploaded files always land in the mounted volume,
      # regardless of what STORAGE_PATH is (or isn't) set to in .env
      - STORAGE_PATH=/app/uploads
    # Published on loopback only. The reverse proxy on this host reaches it there, and
    # Docker's published ports bypass ufw -- bound to every interface, a request straight
    # to :8080 would skip the proxy that TRUSTED_PROXY_COUNT assumes every request passed
    # through, and could forge its own X-Forwarded-For. For a LAN or dev install with no
    # proxy, set BIND_ADDR=0.0.0.0 in .env (compose interpolation reads .env; an
    # override's `environment:` block does not reach this line). Don't add a second
    # mapping in an override instead: two host bindings for one port collide.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    extra_hosts:
      "${APP_DOMAIN}": "host-gateway"
      "${COLLABORA_DOMAIN}": "host-gateway"

  collabora:
    # The default is the Collabora this release was tested with: 26.04.5.1.1, pinned by
    # its multi-arch digest so it cannot move under an install. It moves with our
    # releases -- `./scripts/manage.sh update` brings the next release's pin with
    # everything else -- and moving it is a release of ours: a compose change, so a
    # major (docs/RELEASING.md -> Third-party images). To find a digest:
    #   docker buildx imagetools inspect collabora/code:<version>
    # (the "Digest:" line of the index, not a per-architecture one). A jump between
    # series (25.04 -> 26.04) is checked against the Files editor -- open, edit and
    # save a .docx and an .xlsx -- before the pin moves.
    #
    # COLLABORA_IMAGE in .env overrides the default. Nothing sets it today; it is
    # there so a later release's updater can move this pin without editing a file
    # every update replaces wholesale.
    image: ${COLLABORA_IMAGE:-collabora/code@sha256:bb8f3c9c5c9016045f25fccb5f0649be94469ebc7c7cc379f3576e470cccf33d}
    container_name: collabora
    restart: unless-stopped
    cap_add:
      - MKNOD
      - SYS_ADMIN   # required for coolmount chroot jails
    # Loopback for the same reason as 8080 above; BIND_ADDR opens both. The app reaches
    # Collabora over the compose network, not through this port.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9980:9980"
    environment:
      # Trusts the external public domain requests
      - aliasgroup1=https://${APP_DOMAIN}
      # Trusts the internal Docker network WOPI requests. Must name the same host the app
      # puts in its WOPISrc, so both read WOPI_INTERNAL_HOST from .env with one default.
      - aliasgroup2=http://${WOPI_INTERNAL_HOST:-alliance-manager:8080}
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
    extra_hosts:
      "${APP_DOMAIN}": "host-gateway"
