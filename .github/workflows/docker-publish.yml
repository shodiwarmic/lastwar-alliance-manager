name: Build and Publish Docker Image

# Two publish paths:
#   push to main    -> :edge   (the development image; never :latest)
#   push tag vX.Y.Z -> :vX.Y.Z and :vX.Y, then a DRAFT GitHub Release carrying the
#                      host-files asset (the release-assets job below)
#
# :latest is deliberately NOT moved here. It moves when a human publishes the draft
# (release-published.yml), so :latest and the releases/latest host-files download always
# name the same release -- an APP_VERSION=latest install never pulls a new image beside old
# host files, or the reverse. `latest` means "latest RELEASE", not "latest commit"; that is
# why main publishes :edge instead. See docs/RELEASING.md.
#
# The tag must be pushed from a personal clone. A tag pushed by an action using
# the default GITHUB_TOKEN triggers no workflow at all, so the release would
# build nothing and fail silently.
on:
  push:
    branches: ['main']
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    # Moving the variable here and using string quotes ensures the runner reads it
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    permissions:
      contents: read
      packages: write
      # Read-only access to the check runs on the tagged commit, asserted by the
      # release-level check below. Unlisted scopes default to none, so without
      # this line that read is a 403 even though the repository is public.
      checks: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The release-level check needs the full history: the previous version
          # tag and the diff against it are unreachable from a shallow clone.
          # This also fetches all branches, which is what makes origin/main
          # resolvable while sitting on a tag ref.
          fetch-depth: 0

      # A patch or minor release promises the operator that nothing outside the
      # image changed: they can take it by pulling a new image, without touching
      # compose files, scripts or .env. A single edit to scripts/ inside a patch
      # breaks that promise silently -- the install updates, and the thing that
      # needed a host-side change simply does not work. This check is that
      # promise, machine-verified, and it gates the artifact rather than the PR
      # because no tag exists at PR time.
      #
      # A failure here leaves a tag with no image. The remedy is to delete the
      # tag, fix, and re-tag -- nothing can have pulled a version that never
      # published. See docs/RELEASING.md.
      #
      # It runs as a step rather than its own job for the same reason the checks
      # in build-check.yml do: branch protection pins required contexts to job
      # names.
      - name: Release-level check
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, re, subprocess, sys, urllib.error, urllib.request

          TAG   = os.environ['RELEASE_TAG']
          SHA   = os.environ['GITHUB_SHA']
          REPO  = os.environ['GITHUB_REPOSITORY']
          TOKEN = os.environ['GH_TOKEN']
          API   = os.environ.get('GITHUB_API_URL', 'https://api.github.com')

          # Branch protection's required contexts, by job display name. Pending
          # or absent counts as failure: the release procedure makes that a
          # non-event by ordering the tag after the checks go green.
          REQUIRED_CHECKS = ['Build & Test', 'Docker Build']

          # What each path means for an OPERATOR -- image, host or neutral -- lives in
          # .github/scripts/release_paths.py, shared with build-check.yml's host-files
          # manifest check so the two cannot disagree about what a host receives.
          sys.path.insert(0, '.github/scripts')
          from release_paths import classify_diff

          SEMVER = re.compile(r'^v(\d+)\.(\d+)\.(\d+)$')


          def fail(msg, *extra):
              print('Release-level check FAILED:\n')
              print('  ' + msg)
              for line in extra:
                  print('  ' + line)
              print('\nSee docs/RELEASING.md.')
              sys.exit(1)


          def git(*args):
              return subprocess.run(('git',) + args, capture_output=True, text=True)


          def version_of(tag):
              m = SEMVER.match(tag)
              return tuple(int(p) for p in m.groups()) if m else None


          this = version_of(TAG)
          if this is None:
              fail(f'{TAG} is not a vX.Y.Z tag.',
                   'Release tags are SemVer with the v kept: v1.2.3.')

          # The whole check is worthless if it can silently compare nothing, so
          # every input it relies on is asserted before it is used.
          main = git('rev-parse', '--verify', 'origin/main')
          if main.returncode != 0:
              fail('origin/main is not resolvable in this checkout.',
                   'The checkout step needs fetch-depth: 0 for this to work.')

          # 1. Releases are cut from main. A tag on a side branch would publish
          #    code that never passed review.
          if git('merge-base', '--is-ancestor', SHA, main.stdout.strip()).returncode != 0:
              fail(f'the tagged commit {SHA[:7]} is not an ancestor of origin/main.',
                   'Tag a commit that is on main.')

          # 2. That commit's own CI must have passed. Nothing else stops a tag
          #    being placed on a commit whose checks failed or never ran.
          req = urllib.request.Request(
              f'{API}/repos/{REPO}/commits/{SHA}/check-runs?per_page=100',
              headers={'Authorization': f'Bearer {TOKEN}',
                       'Accept': 'application/vnd.github+json',
                       'X-GitHub-Api-Version': '2022-11-28',
                       'User-Agent': 'release-level-check'})
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  check_runs = json.load(resp)['check_runs']
          except (urllib.error.URLError, KeyError, ValueError) as exc:
              fail(f'could not read the check runs for {SHA[:7]}: {exc}.',
                   'The workflow needs checks: read permission.')

          concluded = {}
          for run in check_runs:
              concluded.setdefault(run['name'], set()).add(run['conclusion'])
          missing = [name for name in REQUIRED_CHECKS
                     if 'success' not in concluded.get(name, set())]
          if missing:
              fail(f'{SHA[:7]} has no successful run of: ' + ', '.join(missing) + '.',
                   'Wait for the checks on that commit to go green, then re-tag.')

          # 3. The previous release, which everything below is measured against.
          all_v_tags = [t for t in git('tag', '--list', 'v*').stdout.split() if t != TAG]
          earlier = sorted(v for v in (version_of(t) for t in all_v_tags)
                           if v is not None and v < this)

          if not earlier:
              # The first release has nothing to diff against. Exempt, but only
              # explicitly: passing by default whenever a previous tag cannot be
              # found is exactly the silent-nothing this check exists to prevent.
              if all_v_tags or this != (1, 0, 0):
                  fail(f'no release before {TAG} could be resolved.',
                       'Only v1.0.0 as the repository\'s first tag is exempt from this.',
                       'Other v* tags present: ' + (', '.join(sorted(all_v_tags)) or 'none'))
              print(f'{TAG} is the first release -- level classification skipped.')
              print('Ancestry and check-run assertions passed.')
              sys.exit(0)

          previous = earlier[-1]
          prev_tag = 'v%d.%d.%d' % previous

          # 4. The level is the delta, not a claim in the commit message.
          if this[0] != previous[0]:
              level = 'major'
          elif this[1] != previous[1]:
              level = 'minor'
          else:
              level = 'patch'

          print(f'{prev_tag} -> {TAG}: {level} release.')

          if level == 'major':
              # A major promises nothing about paths -- it is the level that
              # exists for changes reaching outside the image.
              print('Major release: no path classification applies.')
              sys.exit(0)

          # 5. A patch or minor must be installable by pulling an image alone.
          diff = git('diff', '--name-only', f'{prev_tag}..{TAG}')
          if diff.returncode != 0:
              fail(f'could not diff {prev_tag}..{TAG}: {diff.stderr.strip()}')

          host, unclassified = classify_diff(diff.stdout.split())

          if unclassified:
              fail(f'these paths are not classified, so {TAG} cannot be levelled:',
                   *unclassified,
                   '',
                   'Add each one to IMAGE, HOST or NEUTRAL in .github/scripts/release_paths.py,',
                   'deciding what it asks of an operator receiving the release.')

          if host:
              fail(f'{TAG} is a {level} release, but it changes files outside the image:',
                   *host,
                   '',
                   'An operator cannot take this by pulling an image alone, which is',
                   'what a patch or minor promises. Release it as a major instead.')

          print(f'Release-level check passed: {TAG} changes the image only.')
          EOF

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One spelling of the version everywhere — git tag, image tag,
      # APP_VERSION, Admin page — so nothing ever has to translate between
      # v1.2.3 and 1.2.3. `{{raw}}` is what keeps the pushed tag's leading "v";
      # the moving vX.Y tag gives "track patches, never auto-take a minor".
      # latest=false: :latest moves on publishing the release, not on the tag
      # push (see the header, and release-published.yml).
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}

      # Multi-arch is publish-only. PR CI (build-check.yml's "Docker Build" job)
      # stays amd64: it has a 15-minute timeout and a cold amd64 build already
      # measures ~10 minutes, so a second architecture would blow it on every
      # cache-miss PR. The trade is that an arm64-only breakage surfaces at
      # publish rather than at PR time -- tolerable, because a cross-compiled
      # CGO_ENABLED=0 binary has no arch-specific code path and the emulated
      # part of the build is two apt packages.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # Explicit scopes: this workflow and build-check.yml both fire on the
          # same push to main, and two concurrent builds writing the gha
          # backend's shared default scope would evict each other's entries.
          # Separate scopes trade a little cross-workflow reuse for
          # deterministic behaviour.
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamps the binary so a running install can name its own build --
          # see internal/app/version.go. `meta.outputs.version` is the primary
          # image tag ("edge", or "v1.2.3"), so the stamp cannot disagree with
          # the tag the image was published under. The full 40-char SHA is
          # passed as-is; shortCommit() abbreviates it for display.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT=${{ github.sha }}

  # The host-files asset and the draft release, for tags only. A job of its own, so that when
  # it fails, "Re-run failed jobs" re-runs THIS -- and not the image build, which the
  # never-rebuild rule forbids once the image has been pushed.
  #
  # Idempotent: no release yet -> create a draft carrying the asset; a draft already there ->
  # upload whichever asset it lacks, after checking any it has matches this build byte for
  # byte (the build is deterministic); a PUBLISHED release -> fail without touching it.
  # A human publishes the draft, which is what moves :latest (release-published.yml).
  release-assets:
    name: Release assets
    needs: build-and-push-image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build the host-files asset
        run: .github/scripts/build-host-files.sh "$GITHUB_REF_NAME" dist

      - name: Create or complete the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(dist/host-files.tar.gz dist/host-files.tar.gz.sha256)
          if ! state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" \
              --notes "Draft: replace this with the $TAG section of CHANGELOG.md, then publish. Publishing is what moves :latest and releases/latest." \
              "${assets[@]}"
            echo "Created the draft release $TAG with the host-files asset."
            exit 0
          fi
          if [ "$state" != true ]; then
            echo "::error::Release $TAG is already published; refusing to change its assets."
            exit 1
          fi
          have=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          mkdir -p existing
          for f in "${assets[@]}"; do
            name=$(basename "$f")
            if grep -qxF "$name" <<<"$have"; then
              gh release download "$TAG" --pattern "$name" --dir existing --clobber
              if ! cmp -s "existing/$name" "$f"; then
                echo "::error::The draft's $name differs from this build of $TAG."
                exit 1
              fi
              echo "$name already on the draft and identical."
            else
              gh release upload "$TAG" "$f"
              echo "Uploaded $name to the draft."
            fi
          done
