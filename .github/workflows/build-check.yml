name: Build Check

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Member search must fold diacritics, or a roster "Pacha" spelled with an
      # accent never matches a typed plain one -- and client-side search then
      # disagrees with Go's foldName about what is the same name.
      # See CLAUDE.md -> "Quick search".
      # Runs as a step of this job rather than its own job: the required status
      # checks in branch protection are pinned to job names, and a new job would
      # silently not gate until those are updated.
      - name: Accent-folded search check
        run: |
          python3 - <<'EOF'
          import pathlib, sys

          # `.toLowerCase().includes(` is the hand-rolled accent-blind search this
          # codebase used 23 times before QuickSearch landed. Use QuickSearch.match
          # / .matcher / .filter (or window.foldSearch directly) instead -- they
          # fold diacritics the same way namematch.go's foldName does.
          NEEDLE = '.toLowerCase().includes('

          fails = []
          for path in sorted(pathlib.Path('static').rglob('*.js')):
              for n, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if NEEDLE in line:
                      fails.append(f'{path}:{n}: accent-blind search -- use QuickSearch')

          if fails:
              print('Accent-folded search check failed:\n')
              for f in fails:
                  print('  ' + f)
              print('\nSee CLAUDE.md -> "Quick search".')
              sys.exit(1)
          print('Accent-folded search check passed.')
          EOF

      # Same-origin .js/.css in templates must go through {{asset "..."}} so the
      # URL carries a content-hash ?v= token. A bare src="/foo.js" still WORKS --
      # the static handler falls back to Cache-Control: no-cache -- but it costs a
      # revalidation round-trip on every page load and forfeits the far-future
      # immutable cache. See CLAUDE.md -> "Static asset cache busting".
      - name: Versioned static asset check
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys

          # src/href pointing at a local .js/.css: not already wrapped in {{,
          # not an absolute CDN URL, not protocol-relative.
          BARE = re.compile(r'(?:src|href)="(?!\{\{)(?!https?:)(?!//)([^"]*\.(?:js|css))"')
          # Every {{asset "X"}} must name a file that exists -- a typo would
          # otherwise render an unversioned URL that 404s and nobody notices.
          ASSET = re.compile(r'\{\{\s*asset\s+"([^"]+)"\s*\}\}')

          fails = []
          for path in sorted(pathlib.Path('templates').rglob('*.html')):
              for n, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  for m in BARE.finditer(line):
                      ref = '/' + m.group(1).lstrip('/')
                      fails.append(f'{path}:{n}: unversioned asset "{m.group(1)}" '
                                   f'-- use {{{{asset "{ref}"}}}}')
                  for m in ASSET.finditer(line):
                      if not (pathlib.Path('static') / m.group(1).lstrip('/')).is_file():
                          fails.append(f'{path}:{n}: {{{{asset "{m.group(1)}"}}}} '
                                       f'has no matching file in static/')

          if fails:
              print('Versioned static asset check failed:\n')
              for f in fails:
                  print('  ' + f)
              print('\nSee CLAUDE.md -> "Static asset cache busting".')
              sys.exit(1)
          print('Versioned static asset check passed.')
          EOF

      # Browser translation rewrites text nodes in place, so anything read back
      # out of the DOM is whatever the translator put there.
      # See CLAUDE.md -> Known gotchas -> "Browser translation".
      # Runs as a step of this job rather than its own job: the required status
      # checks in branch protection are pinned to job names, and a new job would
      # silently not gate until those are updated.
      - name: Translation-safety check
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys

          # Server-rendered content inside a <textarea> is a translatable text
          # node; saving the form writes the translation back over the data.
          # <select> is deliberately not checked -- its saved value comes from
          # option.value, an attribute, which is never translated, and templates
          # legitimately wrap <option> lists in {{if}} blocks.
          TEXTAREA = re.compile(r'<textarea\b[^>]*>\s*\{\{')

          # _extractTableData (static/global.js) exports from td.textContent, so a
          # translated exportable table exports translated member names that no
          # longer match on re-import.
          TABLE_TAG = re.compile(r'<table\b[^>]*>')

          # A table with a name column shows identifiers whether or not it is
          # exportable: a translated player name is one nobody can find in the
          # game. Keyed on the header text, which is ours and stable.
          TABLE_BLOCK = re.compile(r'<table\b[^>]*>.*?</table>', re.S)
          TH = re.compile(r'<th\b[^>]*>(.*?)</th>', re.S)
          ID_HEADERS = {'member', 'members', 'name', 'player', 'commander', 'conductor',
                        'vip', 'alliance', 'user', 'username', 'ocr name', 'matched member'}

          fails = []
          for path in sorted(pathlib.Path('templates').rglob('*.html')):
              src = path.read_text(encoding='utf-8')
              for m in TEXTAREA.finditer(src):
                  fails.append(f'{path}:{src.count(chr(10), 0, m.start()) + 1}: '
                               'server-rendered content inside <textarea>')
              for m in TABLE_TAG.finditer(src):
                  if 'data-export-csv' in m.group(0) and 'translate="no"' not in m.group(0):
                      fails.append(f'{path}:{src.count(chr(10), 0, m.start()) + 1}: '
                                   'exportable table is missing translate="no"')
              for m in TABLE_BLOCK.finditer(src):
                  open_tag = m.group(0).split('>', 1)[0] + '>'
                  if 'translate="no"' in open_tag:
                      continue
                  heads = [re.sub(r'<[^>]+>', '', h).strip().lower() for h in TH.findall(m.group(0))]
                  hit = sorted(set(heads) & ID_HEADERS)
                  if hit:
                      fails.append(f'{path}:{src.count(chr(10), 0, m.start()) + 1}: '
                                   f'table with identifier column(s) {hit} is missing translate="no"')

          if fails:
              print('Translation-safety check failed:\n')
              for f in fails:
                  print('  ' + f)
              print('\nSee CLAUDE.md -> Known gotchas -> "Browser translation".')
              sys.exit(1)
          print('Translation-safety check passed.')
          EOF

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
