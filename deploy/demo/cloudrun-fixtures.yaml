# The public demo's fixtures service — the stand-in OCR service and Collabora
# (docs/DEMO.md). Deploy it FIRST: the app's spec names its host. Apply with:
#
#   gcloud run services replace deploy/demo/cloudrun-fixtures.yaml --region <REGION>
#
# Built from deploy/demo/Dockerfile.fixtures and pushed to Artifact Registry.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  # The budget alert filters on this label (docs/DEMO.md).
  labels:
    app: lastwar-demo
  name: lastwar-demo-fixtures
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "1"
        autoscaling.knative.dev/minScale: "0"
    spec:
      # A runtime account of its own, granted only secretAccessor on the demo's two secrets —
      # not the default compute account, which holds Editor on the project.
      serviceAccountName: <RUNTIME-SA>
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: <REGION>-docker.pkg.dev/<PROJECT>/lastwar-demo/demo-fixtures:<VERSION>
          # Flags, not environment variables. frame-ancestors lists the app service's origins —
          # Cloud Run answers on two hostnames (<service>-<project-number>.<region>.run.app and
          # the older <service>-<hash>-<region-code>.a.run.app); a visitor on the one not listed
          # gets a blocked document frame.
          args: ["-port", "8080", "-frame-ancestors", "https://<APP-HOST>.run.app https://<APP-LEGACY-HOST>.a.run.app"]
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 256Mi
              cpu: "1"
