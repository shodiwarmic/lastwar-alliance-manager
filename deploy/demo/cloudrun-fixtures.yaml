# The public demo's fixtures service — the stand-in OCR service and Collabora
# (docs/DEMO.md). Deploy it FIRST: the app's spec names its host. Apply with:
#
#   gcloud run services replace deploy/demo/cloudrun-fixtures.yaml --region <REGION>
#
# Built from deploy/demo/Dockerfile.fixtures and pushed to Artifact Registry.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: lastwar-demo-fixtures
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "1"
        autoscaling.knative.dev/minScale: "0"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: <REGION>-docker.pkg.dev/<PROJECT>/lastwar-demo/demo-fixtures:<VERSION>
          # Flags, not environment variables. frame-ancestors is the app service's origin.
          args: ["-port", "8080", "-frame-ancestors", "https://<APP-HOST>.run.app"]
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 256Mi
              cpu: "1"
