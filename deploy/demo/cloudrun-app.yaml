# The public demo's app service (docs/DEMO.md). Apply with:
#
#   gcloud run services replace deploy/demo/cloudrun-app.yaml --region <REGION>
#
# Replace every <...> first. The image is the RELEASED app image, copied into Artifact
# Registry (Cloud Run cannot pull from GHCR); there is no demo-specific app image.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  # The budget alert filters on this label (docs/DEMO.md).
  labels:
    app: lastwar-demo
  name: lastwar-demo
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # One instance at most: the database is the instance's own disk, so a second
        # instance would be a second, different demo. Zero when idle, to stay free.
        autoscaling.knative.dev/maxScale: "1"
        autoscaling.knative.dev/minScale: "0"
        run.googleapis.com/execution-environment: gen2
    spec:
      # A runtime account of its own, granted only secretAccessor on the demo's two secrets —
      # not the default compute account, which holds Editor on the project.
      serviceAccountName: <RUNTIME-SA>
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: <REGION>-docker.pkg.dev/<PROJECT>/lastwar-demo/alliance-manager:<VERSION>
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
          env:
            - name: DEMO_MODE
              value: "true"
            - name: PRODUCTION
              value: "true"
            - name: HTTPS
              value: "true"
            - name: OCR_BACKEND_MODE
              value: local
            # Measured on the first deploy with /api/demo/whoami (docs/DEMO.md): Google's
            # front end is one hop, and a forged X-Forwarded-For does not move client_ip.
            - name: TRUSTED_PROXY_COUNT
              value: "1"
            - name: DEMO_RESET_HOURS
              value: "6"
            - name: DATABASE_PATH
              value: /app/data/alliance.db
            - name: STORAGE_PATH
              value: /app/uploads
            # The fixtures service: its host for the document iframe, its URL for OCR,
            # and its origin for the CSP.
            - name: COLLABORA_DOMAIN
              value: <FIXTURES-HOST>.run.app
            - name: DEMO_FIXTURES_URL
              value: https://<FIXTURES-HOST>.run.app
            - name: DEMO_FIXTURES_ORIGIN
              value: https://<FIXTURES-HOST>.run.app
            # Secrets. A missing one fails the revision at boot (SESSION_KEY is required
            # under PRODUCTION=true), which is the intended failure.
            - name: SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: lastwar-demo-session-key
                  key: latest
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lastwar-demo-password
                  key: latest
